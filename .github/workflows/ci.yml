name: Cross-Platform CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run panel test suite
        shell: bash
        env:
          ANTIGRAVITY_GEMINI_DIR: ${{ runner.temp }}/agy-test-gemini
        run: node --test --test-concurrency=1 sidecars/panel/test/*.test.mjs

      - name: Verify host-i18n packs
        shell: bash
        run: node host-i18n/scripts/build-packs.mjs --check
